<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi de facturation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E7E8E0;
    --paper-card: #F8F7F2;
    --ink: #1F2A22;
    --ink-soft: #57604F;
    --line: #C7C8BB;
    --line-soft: #DAD9CD;
    --moss: #3F6C4E;
    --moss-deep: #294934;
    --moss-tint: #DCE6DC;
    --rust: #A6461F;
    --rust-tint: #F1DDD1;
    --gold: #B8862E;
    --font-body: 'Inter', sans-serif;
    --font-display: 'Source Serif 4', serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    padding:32px 20px 60px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:28px;flex-wrap:wrap;gap:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
  }
  header.top h1{
    font-family:var(--font-display);
    font-weight:600;font-size:26px;margin:0;letter-spacing:0.2px;
  }
  header.top .sub{font-size:12px;color:var(--ink-soft);margin-top:4px;text-transform:uppercase;letter-spacing:1px;}
  .year-nav{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);}
  .year-nav button{
    background:none;border:1px solid var(--ink);color:var(--ink);
    width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }
  .year-nav button:hover{background:var(--ink);color:var(--paper-card);}
  .year-nav .year{font-size:20px;font-weight:600;min-width:56px;text-align:center;}

  .kpi-row{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px;
  }
  .kpi{
    background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;
  }
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);margin-bottom:6px;}
  .kpi .value{font-family:var(--font-mono);font-size:22px;font-weight:600;}
  .kpi .value.accent{color:var(--moss-deep);}
  .kpi .value.warn{color:var(--rust);}

  .panel-row{
    display:grid;grid-template-columns:220px 1fr;gap:20px;margin-bottom:24px;
  }
  @media (max-width:640px){.panel-row{grid-template-columns:1fr;} .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr));}}

  .panel{
    background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;
  }
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);margin:0 0 12px;font-weight:500;}

  .gauge-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge-caption{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);margin-top:8px;text-align:center;}
  .gauge-caption b{color:var(--ink);font-size:15px;}

  .bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding:0 4px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar{
    width:100%;max-width:26px;background:var(--moss);border-radius:3px 3px 0 0;
    transition:height 0.25s ease;position:relative;
  }
  .bar.empty{background:var(--line-soft);}
  .bar-val{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);margin-bottom:3px;height:12px;}
  .bar-label{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);margin-top:6px;}

  table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:13px;}
  thead th{
    text-align:right;font-weight:500;color:var(--ink-soft);font-size:11px;
    text-transform:uppercase;letter-spacing:0.5px;padding:0 8px 8px;border-bottom:1px solid var(--line);
  }
  thead th:first-child{text-align:left;}
  tbody td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line-soft);}
  tbody td:first-child{text-align:left;font-family:var(--font-body);}
  tbody tr.editing td:first-child{font-weight:500;}
  tbody tr.future td{color:var(--ink-soft);opacity:0.55;}
  .days-input{
    width:64px;text-align:right;font-family:var(--font-mono);font-size:13px;
    border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:#fff;color:var(--ink);
  }
  .days-input:focus{outline:none;border-color:var(--moss);}
  .client-cell{text-align:left !important;}
  thead th:nth-child(2){text-align:left;}
  .client-input{
    width:130px;text-align:left;font-family:var(--font-body);font-size:13px;
    border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:#fff;color:var(--ink);
  }
  .client-input:focus{outline:none;border-color:var(--moss);}
  .save-cell button{
    background:var(--moss);color:#fff;border:none;border-radius:5px;
    padding:4px 10px;font-size:11px;font-family:var(--font-body);cursor:pointer;
  }
  .save-cell button:hover{background:var(--moss-deep);}
  .save-cell .saved{font-size:11px;color:var(--moss-deep);font-family:var(--font-body);}

  .settings{
    margin-bottom:24px;
    display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap;
  }
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);}
  .field input, .field select{
    font-family:var(--font-mono);font-size:14px;border:1px solid var(--line);border-radius:6px;
    padding:6px 10px;width:110px;background:#fff;color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--moss);}
  .settings button{
    background:none;border:1px solid var(--ink);color:var(--ink);border-radius:6px;
    padding:8px 16px;font-size:13px;cursor:pointer;font-family:var(--font-body);height:34px;
  }
  .settings button:hover{background:var(--ink);color:var(--paper-card);}
  .settings .status{font-size:12px;color:var(--moss-deep);font-family:var(--font-body);}
  .loading{text-align:center;padding:60px 0;color:var(--ink-soft);font-family:var(--font-mono);font-size:13px;}
</style>

<script>
const MOIS = ['Janv','Févr','Mars','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'];
const MOIS_LONG = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

let config = { tjm: 500, joursMax: 218, client: '' };
let entries = {};
let clients = {};
let currentYear = new Date().getFullYear();
const thisYear = new Date().getFullYear();
const thisMonth = new Date().getMonth();

const SUPABASE_URL = 'https://qbhvvlakzbspvkmqoooi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_kE4-_1H-8Y2zI5phERgWkw_rfd4xAqm';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let uid = null;

function fmtEUR(n){
  return new Intl.NumberFormat('fr-FR', { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(n);
}
function monthKey(year, monthIdx){
  return year + '-' + String(monthIdx+1).padStart(2,'0');
}

function easterDate(year){
  const a = year % 19, b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19*a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2*e + 2*i - h - k) % 7;
  const m = Math.floor((a + 11*h + 22*l) / 451);
  const month = Math.floor((h + l - 7*m + 114) / 31);
  const day = ((h + l - 7*m + 114) % 31) + 1;
  return new Date(year, month - 1, day);
}

function addDays(date, n){
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

function frenchHolidays(year){
  const easter = easterDate(year);
  const fixed = [
    new Date(year, 0, 1),
    new Date(year, 4, 1),
    new Date(year, 4, 8),
    new Date(year, 6, 14),
    new Date(year, 7, 15),
    new Date(year, 10, 1),
    new Date(year, 10, 11),
    new Date(year, 11, 25),
  ];
  const mobile = [ addDays(easter, 1), addDays(easter, 39), addDays(easter, 50) ];
  return fixed.concat(mobile);
}

function joursOuvres(year){
  const holidaySet = new Set(frenchHolidays(year).map(d => d.toDateString()));
  let count = 0;
  const start = new Date(year, 0, 1);
  const end = new Date(year, 11, 31);
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)){
    const day = d.getDay();
    if (day !== 0 && day !== 6 && !holidaySet.has(d.toDateString())) count++;
  }
  return count;
}

function joursOuvresMois(year, monthIdx){
  const holidaySet = new Set(frenchHolidays(year).map(d => d.toDateString()));
  let count = 0;
  const start = new Date(year, monthIdx, 1);
  const end = new Date(year, monthIdx + 1, 0);
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)){
    const day = d.getDay();
    if (day !== 0 && day !== 6 && !holidaySet.has(d.toDateString())) count++;
  }
  return count;
}

async function loadAll(){
  entries = {}; clients = {};
  const c = await sb.from('config').select('tjm, jours_max, client').maybeSingle();
  if (c.error) console.error('Erreur chargement config', c.error);
  else if (c.data) config = { tjm: Number(c.data.tjm), joursMax: Number(c.data.jours_max), client: c.data.client || '' };
  const e = await sb.from('entries').select('year, month, jours, client');
  if (e.error) console.error('Erreur chargement saisies', e.error);
  else (e.data || []).forEach(r => {
    const key = r.year + '-' + String(r.month).padStart(2, '0');
    entries[key] = Number(r.jours);
    if (r.client) clients[key] = r.client;
  });
  if (typeof config.client !== 'string') config.client = '';
}

async function saveConfig(client, tjm, joursMax){
  config = { client, tjm, joursMax };
  const { error } = await sb.from('config').upsert(
    { user_id: uid, tjm, jours_max: joursMax, client, updated_at: new Date().toISOString() },
    { onConflict: 'user_id' });
  if (error) console.error('Erreur sauvegarde config', error);
  return !error;
}

async function saveEntry(year, monthIdx, jours, client){
  const key = monthKey(year, monthIdx);
  entries = Object.assign({}, entries);
  clients = Object.assign({}, clients);
  if (jours === null){
    delete entries[key]; delete clients[key];
    const { error } = await sb.from('entries').delete()
      .eq('user_id', uid).eq('year', year).eq('month', monthIdx + 1);
    if (error) console.error('Erreur suppression saisie', error);
    return !error;
  }
  entries[key] = jours;
  if (typeof client === 'string' && client !== '') clients[key] = client;
  const { error } = await sb.from('entries').upsert(
    { user_id: uid, year, month: monthIdx + 1, jours, client: clients[key] || '', updated_at: new Date().toISOString() },
    { onConflict: 'user_id,year,month' });
  if (error) console.error('Erreur sauvegarde saisie', error);
  return !error;
}

function yearStats(year){
  let jours = 0, ca = 0;
  const monthly = [];
  for (let m=0; m<12; m++){
    const v = entries[monthKey(year,m)];
    const j = (typeof v === 'number') ? v : null;
    if (j !== null){ jours += j; ca += j * config.tjm; }
    monthly.push(j);
  }
  return { jours, ca, monthly };
}

function exportExcel(year, stats){
  const rows = [['Mois', 'Jours', 'CA du mois (HT)', 'CA cumulé (HT)']];
  let cumul = 0;
  stats.monthly.forEach((v, i) => {
    const caMois = v ? v * config.tjm : 0;
    if (v) cumul += caMois;
    rows.push([MOIS_LONG[i], v !== null ? v : '', v !== null ? caMois : '', v !== null ? cumul : '']);
  });
  rows.push([]);
  rows.push(['Client', config.client || '']);
  rows.push(['TJM (€ HT)', config.tjm]);
  rows.push(['Volume jour annuel max', config.joursMax]);
  rows.push(['CA cumulé (HT)', stats.ca]);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, String(year));
  XLSX.writeFile(wb, `suivi-facturation-${year}.xlsx`);
}

async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text;
}

function parseInvoice(text){
  text = text.replace(/[\s\u00a0\u202f]+/g, ' ');
  const norm = text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const MOIS_NORM = MOIS_LONG.map(m => m.normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
  const toNum = s => parseFloat(s.replace(/[\s\u00a0\u202f]/g, '').replace(',', '.'));
  const AMT = '(\\d{1,3}(?:[\\s\\u00a0\\u202f]\\d{3})+(?:[.,]\\d{2})?|\\d+(?:[.,]\\d{2})?)';

  // Mois / année : 1) période des prestations, 2) nom du mois dans le texte, 3) date d'émission
  let monthIdx = null, year = null;
  const period = text.match(/du\s+\d{1,2}\/(\d{2})\/(\d{4})\s+au\s+\d{1,2}\/\d{2}\/\d{4}/i);
  if (period){
    monthIdx = parseInt(period[1], 10) - 1;
    year = parseInt(period[2], 10);
  }
  if (monthIdx === null){
    const named = norm.match(new RegExp('\\b(' + MOIS_NORM.join('|') + ')\\b(?:\\s+(20\\d{2}))?'));
    if (named){
      monthIdx = MOIS_NORM.indexOf(named[1]);
      if (named[2]) year = parseInt(named[2], 10);
    }
  }
  if (monthIdx === null){
    const issued = text.match(/[ée]mise\s+le\s*:?\s*\d{1,2}\/(\d{2})\/(\d{4})/i);
    if (issued){
      monthIdx = parseInt(issued[1], 10) - 1;
      year = parseInt(issued[2], 10);
    }
  }
  if (year === null){
    const y = text.match(/\b20\d{2}\b/);
    year = y ? parseInt(y[0], 10) : null;
  }

  // Jours (colonne Qté du tableau) et CA HT (total de la ligne)
  let jours = null, ca = null;
  const row = text.match(new RegExp(
    '(?<!\\d)' + AMT + '\\s*€\\s+(\\d+(?:[.,]\\d+)?)\\s+\\d+(?:[.,]\\d+)?\\s*%\\s+' + AMT + '\\s*€'));
  if (row){
    jours = toNum(row[2]);
    ca = toNum(row[3]);
  }
  if (jours === null){
    const joursPatterns = [
      /(\d+(?:[.,]\d+)?)\s*jours?/i,
      /(?:quantit[ée]|qt[ée])\s*:?\s*(\d+(?:[.,]\d+)?)/i,
      /(\d+(?:[.,]\d+)?)\s*(?:quantit[ée]|qt[ée])/i,
    ];
    for (const re of joursPatterns){
      const m = text.match(re);
      if (m){ jours = toNum(m[1]); break; }
    }
  }
  if (ca === null){
    const ht = text.match(new RegExp('total\\s*ht[\\s\\S]*?(?<!\\d)' + AMT + '\\s*€', 'i'));
    if (ht) ca = toNum(ht[1]);
  }
  if (ca === null){
    const amounts = [...text.matchAll(new RegExp('(?<!\\d)' + AMT + '\\s*€', 'g'))]
      .map(m => toNum(m[1])).filter(n => !isNaN(n));
    ca = amounts.length ? Math.max(...amounts) : null;
  }
  return { monthIdx, year, jours, ca };
}

function openImportModal(parsed){
  const overlay = document.createElement('div');
  overlay.id = 'import-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(31,42,34,0.45);display:flex;align-items:center;justify-content:center;z-index:999;';
  const monthOptions = MOIS_LONG.map((m, i) =>
    `<option value="${i}" ${parsed.monthIdx === i ? 'selected' : ''}>${m}</option>`).join('');
  overlay.innerHTML = `
    <div style="background:var(--paper-card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;width:300px;">
      <h2 style="margin:0 0 14px;font-size:14px;">Confirmer l'import</h2>
      <div class="field" style="margin-bottom:10px;"><label>Mois</label><select id="imp-month" style="width:100%;">${monthOptions}</select></div>
      <div class="field" style="margin-bottom:10px;"><label>Année</label><input id="imp-year" type="number" value="${parsed.year || currentYear}" style="width:100%;"></div>
      <div class="field" style="margin-bottom:10px;"><label>Nom du client</label><input id="imp-client" type="text" value="${(config.client || '').replace(/"/g, '&quot;')}" style="width:100%;"></div>
      <div class="field" style="margin-bottom:10px;"><label>Jours facturés</label><input id="imp-jours" type="number" step="0.5" min="0" value="${parsed.jours !== null ? parsed.jours : ''}" style="width:100%;"></div>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:14px;line-height:1.4;">
        CA détecté sur la facture : <b>${parsed.ca !== null ? fmtEUR(parsed.ca) : 'non détecté'}</b> (HT, indicatif — le CA du suivi reste calculé à partir du TJM)
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button id="imp-cancel" style="background:none;border:1px solid var(--ink);color:var(--ink);border-radius:6px;padding:7px 14px;cursor:pointer;font-family:var(--font-body);">Annuler</button>
        <button id="imp-confirm" style="background:var(--moss);color:#fff;border:none;border-radius:6px;padding:7px 14px;cursor:pointer;font-family:var(--font-body);">Reporter</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('imp-cancel').onclick = () => overlay.remove();
  document.getElementById('imp-confirm').onclick = async () => {
    const monthIdx = parseInt(document.getElementById('imp-month').value, 10);
    const year = parseInt(document.getElementById('imp-year').value, 10);
    const jours = parseFloat(document.getElementById('imp-jours').value);
    const client = document.getElementById('imp-client').value.trim();
    if (isNaN(year) || isNaN(jours) || jours < 0) return;
    currentYear = year;
    overlay.remove();
    const saving = saveEntry(year, monthIdx, jours, client);
    render();
    const ok = await saving;
    const status = document.getElementById('settings-status');
    if (status){
      status.textContent = ok ? 'Facture reportée' : 'Reporté mais non sauvegardé (stockage indisponible)';
      status.style.color = ok ? '' : 'var(--rust)';
      setTimeout(() => { status.textContent = ''; }, 4000);
    }
  };
}

function render(){
  const app = document.getElementById('app');
  const stats = yearStats(currentYear);
  const pct = config.joursMax > 0 ? Math.min(100, Math.round((stats.jours / config.joursMax) * 100)) : 0;
  const joursRestants = Math.max(0, config.joursMax - stats.jours);
  const overBudget = stats.jours > config.joursMax;

  const ouvres = joursOuvres(currentYear);
  const congesAPrendre = Math.max(0, ouvres - config.joursMax);

  let congesPris = 0;
  stats.monthly.forEach((v, i) => {
    if (v !== null) congesPris += Math.max(0, joursOuvresMois(currentYear, i) - v);
  });
  const congesPct = congesAPrendre > 0
    ? Math.min(100, Math.round((congesPris / congesAPrendre) * 100))
    : (congesPris > 0 ? 100 : 0);
  const overConges = congesPris > congesAPrendre;

  const maxBar = Math.max(1, ...stats.monthly.map(v => v || 0));

  const barsHtml = stats.monthly.map((v, i) => {
    const h = v ? Math.max(4, Math.round((v / maxBar) * 100)) : 3;
    const isFuture = currentYear === thisYear && i > thisMonth;
    return `
      <div class="bar-col">
        <div class="bar-val">${v !== null ? v : ''}</div>
        <div class="bar ${v ? '' : 'empty'}" style="height:${h}%"></div>
        <div class="bar-label">${MOIS[i]}</div>
      </div>`;
  }).join('');

  const rowsHtml = stats.monthly.map((v, i) => {
    const key = monthKey(currentYear, i);
    const isFuture = currentYear === thisYear && i > thisMonth;
    const caMois = v ? v * config.tjm : 0;
    let cumul = 0;
    for (let k=0;k<=i;k++){ const vv = stats.monthly[k]; if (vv) cumul += vv * config.tjm; }
    return `
      <tr class="${isFuture ? 'future' : ''}" data-idx="${i}">
        <td>${MOIS_LONG[i]}</td>
        <td class="client-cell"><input class="client-input" type="text" data-month="${i}" value="${(clients[key] || '').replace(/"/g, '&quot;')}" placeholder="—"></td>
        <td><input class="days-input" type="number" min="0" max="31" step="0.5" value="${v !== null ? v : ''}" data-month="${i}" placeholder="—"></td>
        <td>${v !== null ? fmtEUR(caMois) : '—'}</td>
        <td>${v !== null ? fmtEUR(cumul) : '—'}</td>
        <td class="save-cell"><button data-month="${i}">Enregistrer</button></td>
      </tr>`;
  }).join('');

  app.innerHTML = `
    <header class="top">
      <div>
        <h1>Suivi de facturation</h1>
        <div class="sub">Jours facturés &amp; chiffre d'affaires cumulé</div>
      </div>
      <div class="year-nav">
        <button id="prev-year" aria-label="Année précédente">‹</button>
        <span class="year">${currentYear}</span>
        <button id="next-year" aria-label="Année suivante">›</button>
        <button id="logout" style="width:auto;padding:0 10px;font-family:var(--font-body);font-size:12px;margin-left:8px;">Déconnexion</button>
      </div>
    </header>

    <div class="settings panel">
      <h2 style="width:100%;">Modalités mission</h2>
      <div class="field">
        <label for="client-input">Nom client</label>
        <input id="client-input" type="text" value="${config.client || ''}" placeholder="—" style="width:180px;">
      </div>
      <div class="field">
        <label for="tjm-input">TJM (€ HT)</label>
        <input id="tjm-input" type="number" min="0" step="10" value="${config.tjm}">
      </div>
      <div class="field">
        <label for="max-input">Volume jour annuel max</label>
        <input id="max-input" type="number" min="0" step="1" value="${config.joursMax}">
      </div>
      <button id="save-settings">Mettre à jour</button>
      <button id="export-excel">Éditer dans Excel</button>
      <button id="import-invoice">Importer une facture</button>
      <input type="file" id="invoice-file" accept="application/pdf" style="display:none;">
      <span class="status" id="settings-status"></span>
    </div>

    <div class="kpi-row">
      <div class="kpi">
        <div class="label">Jours ouvrés</div>
        <div class="value">${ouvres}</div>
      </div>
      <div class="kpi">
        <div class="label">Jours ouvrés restant</div>
        <div class="value ${overBudget ? 'warn' : ''}">${overBudget ? '+' + (stats.jours - config.joursMax) + ' dépassés' : joursRestants}</div>
      </div>
      <div class="kpi">
        <div class="label">CA cumulé ${currentYear} (HT)</div>
        <div class="value accent">${fmtEUR(stats.ca)}</div>
      </div>
      <div class="kpi">
        <div class="label">Congés à prendre</div>
        <div class="value accent">${congesAPrendre}</div>
      </div>
    </div>

    <div class="panel-row">
      <div style="display:flex;flex-direction:column;gap:20px;">
        <div class="panel gauge-wrap">
          <h2 style="align-self:flex-start;">Suivi activité</h2>
          <svg viewBox="0 0 160 100" width="180" height="112">
            <path d="M 15 90 A 65 65 0 0 1 145 90" fill="none" stroke="var(--line-soft)" stroke-width="10" stroke-linecap="round"/>
            <path d="M 15 90 A 65 65 0 0 1 145 90" fill="none" stroke="${overBudget ? 'var(--rust)' : 'var(--moss)'}" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="${Math.min(pct,100) * 2.04} 999"/>
            <text x="80" y="72" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="24" fill="var(--ink)">${pct}%</text>
          </svg>
          <div class="gauge-caption"><b>${stats.jours}</b> / ${config.joursMax} jours facturés</div>
        </div>

        <div class="panel gauge-wrap">
          <h2 style="align-self:flex-start;">Suivi congés</h2>
          <svg viewBox="0 0 160 100" width="180" height="112">
            <path d="M 15 90 A 65 65 0 0 1 145 90" fill="none" stroke="var(--line-soft)" stroke-width="10" stroke-linecap="round"/>
            <path d="M 15 90 A 65 65 0 0 1 145 90" fill="none" stroke="${overConges ? 'var(--rust)' : 'var(--gold)'}" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="${Math.min(congesPct,100) * 2.04} 999"/>
            <text x="80" y="72" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="24" fill="var(--ink)">${congesPct}%</text>
          </svg>
          <div class="gauge-caption"><b>${congesPris}</b> / ${congesAPrendre} jours de congés pris</div>
        </div>
      </div>

      <div class="panel">
        <h2>Jours facturés par mois</h2>
        <div class="bars">${barsHtml}</div>
      </div>
    </div>

    <div class="panel">
      <h2>Grand livre ${currentYear}</h2>
      <table>
        <thead>
          <tr><th>Mois</th><th>Client</th><th>Jours</th><th>CA du mois (HT)</th><th>CA cumulé (HT)</th><th></th></tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
  `;

  document.getElementById('logout').onclick = async () => { await sb.auth.signOut(); };
  document.getElementById('prev-year').onclick = () => { currentYear--; render(); };
  document.getElementById('next-year').onclick = () => { currentYear++; render(); };

  document.getElementById('save-settings').onclick = async () => {
    const client = document.getElementById('client-input').value.trim();
    const tjm = parseFloat(document.getElementById('tjm-input').value) || 0;
    const max = parseFloat(document.getElementById('max-input').value) || 0;
    await saveConfig(client, tjm, max);
    const status = document.getElementById('settings-status');
    status.textContent = 'Enregistré';
    setTimeout(() => { status.textContent = ''; }, 2000);
    render();
  };

  document.getElementById('export-excel').onclick = () => {
    exportExcel(currentYear, stats);
  };

  document.getElementById('import-invoice').onclick = () => {
    document.getElementById('invoice-file').click();
  };
  document.getElementById('invoice-file').onchange = async (ev) => {
    const file = ev.target.files[0];
    ev.target.value = '';
    if (!file) return;
    try {
      const text = await extractPdfText(file);
      openImportModal(parseInvoice(text));
    } catch(e) {
      console.error('Erreur lecture facture', e);
      alert("Impossible de lire cette facture. Vérifie qu'il s'agit bien d'un PDF.");
    }
  };

  app.querySelectorAll('.save-cell button').forEach(btn => {
    btn.onclick = async () => {
      const m = parseInt(btn.dataset.month, 10);
      const input = app.querySelector(`.days-input[data-month="${m}"]`);
      const raw = input.value.trim();
      const val = raw === '' ? null : parseFloat(raw);
      if (raw !== '' && (isNaN(val) || val < 0)){
        input.style.borderColor = 'var(--rust)';
        return;
      }
      const clientInput = app.querySelector(`.client-input[data-month="${m}"]`);
      let client = clientInput ? clientInput.value.trim() : '';
      if (client === '' && val !== null) client = config.client || '';
      await saveEntry(currentYear, m, val, client);
      render();
    };
  });
}

function renderLogin(message){
  document.getElementById('app').innerHTML = `
    <div class="panel" style="max-width:340px;margin:80px auto 0;">
      <h1 style="font-family:var(--font-display);font-size:22px;margin:0 0 4px;">Suivi de facturation</h1>
      <div class="sub" style="font-size:12px;color:var(--ink-soft);margin-bottom:18px;">Connexion</div>
      <div class="field" style="margin-bottom:10px;"><label for="lg-email">Email</label><input id="lg-email" type="email" autocomplete="username" style="width:100%;"></div>
      <div class="field" style="margin-bottom:14px;"><label for="lg-pass">Mot de passe</label><input id="lg-pass" type="password" autocomplete="current-password" style="width:100%;"></div>
      <button id="lg-btn" style="background:var(--moss);color:#fff;border:none;border-radius:6px;padding:9px 16px;cursor:pointer;font-family:var(--font-body);width:100%;">Se connecter</button>
      <div id="lg-msg" style="font-size:12px;color:var(--rust);margin-top:10px;min-height:16px;">${message || ''}</div>
    </div>`;
  const go = async () => {
    const email = document.getElementById('lg-email').value.trim();
    const password = document.getElementById('lg-pass').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) document.getElementById('lg-msg').textContent = 'Connexion impossible : ' + error.message;
  };
  document.getElementById('lg-btn').onclick = go;
  document.getElementById('lg-pass').onkeydown = ev => { if (ev.key === 'Enter') go(); };
}

async function startForSession(session){
  if (!session){ uid = null; renderLogin(); return; }
  uid = session.user.id;
  document.getElementById('app').innerHTML = '<div class="loading">Chargement du suivi…</div>';
  await loadAll();
  render();
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'SIGNED_OUT'){
    // différé pour ne pas bloquer le client Supabase dans son propre callback
    setTimeout(() => startForSession(session), 0);
  }
});
</script>
</body>
</html>
